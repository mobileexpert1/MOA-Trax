dependencies {

    implementation project(':AppentusDataSource')

    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:core:1.5.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    /**Glide */
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    ksp 'com.github.bumptech.glide:ksp:4.16.0'

    // View Model Provider
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'com.mindorks.android:prdownloader:0.6.0'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    // Facebook
    implementation 'com.facebook.android:facebook-login:8.2.0'

    implementation 'com.github.angads25:toggle:1.1.0'

    // Google Play Services
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
    implementation 'com.google.android.gms:play-services-base:18.7.2'
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.3.0'

    // lottie animation
    implementation 'com.airbnb.android:lottie:6.6.7'

    implementation(AndroidX.lifeCycleCommon)
    implementation(AndroidX.paging3)
    implementation(AndroidX.roomKtx)
    implementation(AndroidX.roomRuntime)
    ksp AndroidX.roomKapt

    implementation "com.google.firebase:firebase-messaging:25.0.2"
    implementation "com.google.firebase:firebase-analytics:23.0.0"

    implementation "com.mapbox.maps:android-ndk27:11.21.1"
}

