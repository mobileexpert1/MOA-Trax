android {
    namespace 'com.trax.app'

    compileSdk 36

    defaultConfig {
        applicationId "com.trax.app"
        minSdk 23
        targetSdk 36
        versionCode 43
        versionName "1.6.8"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [
                MAPBOX_ACCESS_TOKEN: project.findProperty("MAPBOX_ACCESS_TOKEN")
        ]

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        buildConfigField("String", "API_URL", API_URL)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            keyAlias "key0"
            keyPassword "12345678"
            storeFile file('C:\\Users\\Appentus_Android_11\\Documents\\GitHub\\geopdf\\geopdf.jks')
            storePassword "12345678"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }


        packagingOptions {
        jniLibs {
            // Ensure uncompressed/aligned native packaging expected by modern Play checks.
            useLegacyPackaging false
        }
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }
    repositories {
        maven { url 'https://jitpack.io' }
    }
    // NDK r28+ is recommended for 16KB-page-size compliant native builds.
    ndkVersion "28.0.12433566"
